# probe-planb5.yml — PR furnace probe lane for the planb5 sigma17 draft (PR #8).
# Why this file exists: the certification furnace (coq93.yml) pins checkout to the
# PR merge_commit_sha; on fork-origin PRs upload-pack rejects the sha-want
# ("not our ref" -- merge commits are only served via the symbolic
# refs/pull/N/merge). This probe lane checks out the SYMBOLIC merge ref instead
# and runs a self-contained 7-shot cascade + coqchk on the assembly. It touches
# no certification gate: coq93.yml stays the only verdict authority; this lane
# is a platform signal only (draft PR, do-not-merge).
name: probe planb5 sigma17 draft
on: [pull_request]

concurrency:
  group: cw-probe-planb5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, Windows]
    env:
      COQC: D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqc.exe
      COQCHK: D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqchk.exe
    steps:
      - name: Checkout PR merge ref (symbolic)
        uses: actions/checkout@v5
        with:
          ref: "refs/pull/${{ github.event.pull_request.number }}/merge"
          fetch-depth: 1

      - name: 7-shot cascade + coqchk probe (planb5_hesc17_assembly)
        shell: bash
        run: |
          set -e
          cd ConstructiveWorld_Live
          for f in S01_BaseRing S02_CauchyComplete piu_mu_criterion \
                   planb1_hcage_zerotouch_prescription \
                   piu_zz_padic_clearing planb3_g1_calib \
                   planb5_hesc17_assembly; do
            echo "[probe] shot $f"
            "$COQC" -native-compiler no -q -Q . "" "$f.v"
          done
          echo "[probe] coqchk planb5_hesc17_assembly"
          "$COQCHK" -o -silent -Q . "" planb5_hesc17_assembly
          echo "PROBE-GREEN: 7-shot cascade rc=0 + coqchk CHKRC=0 on furnace toolchain"

      - name: Probe stamp
        if: always()
        shell: bash
        run: echo "probe lane done (draft sigma=17, superseded by sigma=18 final PR)"
