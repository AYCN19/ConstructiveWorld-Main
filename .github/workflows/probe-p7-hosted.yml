# probe-p7-hosted.yml — hosted-runner CI lane for the P7 mach assembly landing content.
# This branch carries the P7 mach assembly products: the Machin bridge-amplify cast
# (cast_bridge.v), the modulus-of-convergence function (cast_modulus.v), the parity
# interleave cast (cast_parity.v), the Hval table domain (planb5_p7_hval_table.v;
# kernel proof face n<=20, full 40-point numeric certificate via exact rational
# sweep with an independent mirror recomputation), and the assembly
# (planb5_p7_mach_assembly.v; Print Assumptions 7/7 Closed, coqchk Axioms:<none>
# under two-root certification locally, born-clean census magic=0).
# Landing this content into main = P7 exit-assembly landing (front piece for the L5
# exit re-derivation). This lane gives the content CI on a hosted runner; the
# certification furnace remains the verdict authority.
name: probe p7 hosted
on: [push, workflow_dispatch]

concurrency:
  group: cw-probe-p7
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.0

      - name: Install Rocq 9.3.0 (defensive multi-archive)
        run: |
          opam repo add rocq-archive https://github.com/rocq-prover/opam || true
          opam repo add coq-released https://coq.inria.fr/opam-repository || true
          opam update
          opam install -y rocq-runtime.9.3.0 rocq-core.9.3.0 coq-core.9.3.0 coq-stdlib.9.3.0 || \
          opam install -y rocq-runtime.9.3.0 rocq-core.9.3.0 rocq-stdlib.9.3.0 || \
          opam install -y coq.9.3.0 || \
          opam install -y coq-core.9.3.0 coq-stdlib.9.3.0
          opam exec -- coqc -v

      - name: "16-shot cascade + coqchk (P7 - S-chain base + 4 casts + assembly)"
        run: |
          opam exec -- bash -c '
            set -e
            cd ConstructiveWorld_Live
            for f in S01_BaseRing S02_CauchyComplete S03_QExp S04_RealExpLogConv \
                     S05_AlignmentGRPO S06_DiffSamplingGibbs S07_RealSetoidExpLog \
                     S08_RealMainlineDPO S09_EntropyReal S10_KVQuantTrig S11_TP3B5 \
                     cast_bridge cast_modulus cast_parity planb5_p7_hval_table; do
              echo "[probe] shot $f"
              coqc -native-compiler no -q -Q . "" "$f.v"
            done
            echo "[probe] coqchk planb5_p7_mach_assembly (two roots: assembly + table)"
            coqchk -o -Q . "" planb5_p7_mach_assembly
            test -f planb5_p7_mach_assembly.vo
            echo "P7-PROBE-GREEN: hosted rocq93 15-shot cascade rc=0 + coqchk clean"
          '

      - name: "coqchk table root (second certification root)"
        run: |
          opam exec -- bash -c '
            set -e
            cd ConstructiveWorld_Live
            coqchk -o -Q . "" planb5_p7_hval_table
            echo "P7-PROBE-GREEN-2: second root checked"
          '

      - name: Probe stamp
        if: always()
        run: echo "p7 hosted probe done (landing content CI signal; merge decision rests with the maintainers)"
